services:
  - type: web
    name: trustvault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRUSTVAULT_SECRET
        generateValue: true
      - key: TRUSTVAULT_HTTPS
        value: "1"
      - key: TRUSTVAULT_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_VIEWER_PASSWORD
        sync: false
      - key: SEED_OTHER_PASSWORD
        sync: false
